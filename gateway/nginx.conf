# Adresy služieb sa prekladajú priebežne cez DNS Dockeru (resolve): po prestavaní jedného kontajnera
# dostane nový kontajner inú IP a brána by inak posielala požiadavky na starú adresu (chyba 502).
resolver 127.0.0.11 valid=10s ipv6=off;
# Strop požiadaviek z jednej adresy na prihlásenie a obe API (bežná práca je hlboko pod ním).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
server_tokens off;
upstream portal_up { zone portal_up 64k; server portal:8000 resolve; }
upstream workplan_api_up { zone workplan_api_up 64k; server workplan-api:8000 resolve; }
upstream workplan_ui_up { zone workplan_ui_up 64k; server workplan-ui:80 resolve; }
upstream logbook_api_up { zone logbook_api_up 64k; server logbook-api:8000 resolve; }
upstream logbook_ui_up { zone logbook_ui_up 64k; server logbook-ui:8080 resolve; }

server {
 listen 80;
 server_name _;
 client_max_body_size 12m;
 # Relatívne presmerovania: za portom 8090 aj za HTTPS tunelom by absolútne viedli na http://…:80.
 absolute_redirect off;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
 # Za tunelom (Tailscale Funnel) prichádzajú všetky požiadavky z brány Docker siete; skutočnú IP návštevníka
 # berieme z X-Forwarded-For, aby limit prihlásení v portáli nebol spoločný pre všetkých. Bezpečné iba pri
 # BIND_ADDRESS=127.0.0.1, keď sa na port nedá pripojiť priamo z LAN.
 set_real_ip_from 127.0.0.1;
 set_real_ip_from 172.16.0.0/12;
 real_ip_header X-Forwarded-For;
 real_ip_recursive off;
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header Cookie $http_cookie;
 location /internal/ { return 404; }
 location ^~ /workplan/api/internal/ { return 404; }
 location ^~ /vehicle-logbook/api/internal/ { return 404; }
 # Prístup k rozhraniu aplikácie: 401 = neprihlásený, 403 = nemá pridelenú aplikáciu (overuje portál).
 location = /_access/workplan {
  internal;
  proxy_pass http://portal_up/auth/app/workplan;
  proxy_pass_request_body off;
  # vlastný proxy_set_header ruší zdedené hlavičky zo servera, preto ich opakujeme
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Cookie $http_cookie;
 }
 location = /_access/vehicle-logbook {
  internal;
  proxy_pass http://portal_up/auth/app/vehicle-logbook;
  proxy_pass_request_body off;
  # vlastný proxy_set_header ruší zdedené hlavičky zo servera, preto ich opakujeme
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Cookie $http_cookie;
 }
 location = /workplan { return 302 /workplan/; }
 location = /vehicle-logbook { return 302 /vehicle-logbook/; }
 # AI (Gemini) môže odpovedať aj desiatky sekúnd a pri preťažení sa opakuje s ľahším modelom
 location ^~ /workplan/api/ { limit_req zone=api burst=120 nodelay; proxy_pass http://workplan_api_up/api/; proxy_read_timeout 150s; }
 location ^~ /vehicle-logbook/api/ { limit_req zone=api burst=120 nodelay; proxy_pass http://logbook_api_up/api/; proxy_read_timeout 150s; }
 location /workplan/ {
  auth_request /_access/workplan;
  error_page 401 = @workplan_login;
  error_page 403 = @no_access;
  proxy_pass http://workplan_ui_up/;
 }
 location /vehicle-logbook/ {
  auth_request /_access/vehicle-logbook;
  error_page 401 = @logbook_login;
  error_page 403 = @no_access;
  proxy_pass http://logbook_ui_up/;
 }
 location @workplan_login { return 302 /?next=workplan; }
 location @logbook_login { return 302 /?next=vehicle-logbook; }
 location @no_access { return 302 /?denied=1; }
 location ^~ /auth/ { limit_req zone=api burst=120 nodelay; proxy_pass http://portal_up; }
 location / { proxy_pass http://portal_up; }
}
